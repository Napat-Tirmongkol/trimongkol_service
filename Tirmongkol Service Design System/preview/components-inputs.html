<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:26px;display:flex;gap:22px}
  .col{flex:1}
  label{display:block;font-size:13px;font-weight:500;color:#334155;margin-bottom:6px}
  input,select{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:9px 12px;font-size:14px;color:#0f172a;font-family:inherit}
  input::placeholder{color:#94a3b8}
  .focused{border-color:#3366ff;box-shadow:0 0 0 3px rgba(51,102,255,.2);outline:none}
  .radio{display:flex;gap:11px;align-items:flex-start;border:1px solid #3366ff;background:#eef4ff;border-radius:9px;padding:11px}
  .radio .dot{width:16px;height:16px;border-radius:50%;border:5px solid #1f47e6;flex:0 0 16px;margin-top:1px}
  .radio .t{font-size:13px;font-weight:600;color:#0f172a}
  .radio .d{font-size:12px;color:#475569;margin-top:1px}
</style></head><body>
  <div class="col">
    <label>Full name</label>
    <input value="Ms. Anna Suwan" class="focused">
    <label style="margin-top:16px">Email</label>
    <input placeholder="you@example.com">
  </div>
  <div class="col">
    <label>Scoring mode</label>
    <div class="radio"><div class="dot"></div><div><div class="t">Check only</div><div class="d">Just mark "submitted" on scan — fastest.</div></div></div>
    <label style="margin-top:16px">Category</label>
    <select><option>Homework</option></select>
  </div>
</body></html>
