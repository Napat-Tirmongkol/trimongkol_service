<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:24px}
  .grid{display:flex;gap:10px;flex-wrap:wrap}
  .ic{width:46px;height:46px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;color:#1f47e6}
  .ic svg{width:22px;height:22px}
  .note{margin-top:16px;font-size:12px;color:#64748b;line-height:1.55}
  b{color:#1936b8}
</style></head><body>
  <div class="grid">
    <div class="ic"><i data-lucide="arrow-right"></i></div>
    <div class="ic"><i data-lucide="check"></i></div>
    <div class="ic"><i data-lucide="users"></i></div>
    <div class="ic"><i data-lucide="clipboard-check"></i></div>
    <div class="ic"><i data-lucide="bar-chart-3"></i></div>
    <div class="ic"><i data-lucide="scan-line"></i></div>
    <div class="ic"><i data-lucide="qr-code"></i></div>
    <div class="ic"><i data-lucide="mail"></i></div>
    <div class="ic"><i data-lucide="phone"></i></div>
    <div class="ic"><i data-lucide="clock"></i></div>
    <div class="ic"><i data-lucide="eye"></i></div>
    <div class="ic"><i data-lucide="menu"></i></div>
  </div>
  <p class="note">Heroicons / Feather idiom — 24px viewbox, <b>stroke-width 2</b>, round caps, currentColor. Hand-rolled in the product; previewed here with <b>Lucide</b> (CDN) as a close stand-in.</p>
  <script>lucide.createIcons();</script>
</body></html>
