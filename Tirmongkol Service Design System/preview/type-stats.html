<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:26px;display:flex;align-items:center;gap:40px}
  .stats{display:flex;gap:34px}
  .stat .n{font-size:38px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat .l{font-size:12px;color:#64748b;margin-top:2px}
  .divider{width:1px;height:64px;background:#e2e8f0}
  .codes{display:flex;flex-direction:column;gap:8px}
  .codes .cap{font-size:11px;color:#94a3b8;font-weight:500}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#f1f5f9;color:#334155;padding:3px 9px;border-radius:5px}
</style></head><body>
  <div class="stats">
    <div class="stat"><div class="n">120+</div><div class="l">Projects Delivered</div></div>
    <div class="stat"><div class="n">24/7</div><div class="l">Support</div></div>
  </div>
  <div class="divider"></div>
  <div class="codes"><span class="cap">Student code · monospace</span><span class="code">A7F3K9Q2</span></div>
</body></html>
