<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:22px}
  .row{display:grid;grid-template-columns:repeat(11,1fr);gap:0;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid #e2e8f0}
  .sw{height:76px;display:flex;align-items:flex-end;padding:7px 8px;font-size:10px;font-weight:600}
  .meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#64748b}
  .tag{font-weight:600;color:#334155}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:#f8fafc;color:#475569">50</div>
    <div class="sw" style="background:#f1f5f9;color:#475569">100</div>
    <div class="sw" style="background:#e2e8f0;color:#475569">200</div>
    <div class="sw" style="background:#cbd5e1;color:#334155">300</div>
    <div class="sw" style="background:#94a3b8;color:#fff">400</div>
    <div class="sw" style="background:#64748b;color:#fff">500</div>
    <div class="sw" style="background:#475569;color:#fff">600</div>
    <div class="sw" style="background:#334155;color:#fff">700</div>
    <div class="sw" style="background:#1e293b;color:#fff">800</div>
    <div class="sw" style="background:#0f172a;color:#fff">900</div>
    <div class="sw" style="background:#020617;color:#fff">950</div>
  </div>
  <div class="meta"><span><span class="tag">slate</span> — the neutral workhorse</span><span>text <span class="tag">900</span> · body <span class="tag">600</span> · meta <span class="tag">500</span> · footer <span class="tag">950</span></span></div>
</body></html>
