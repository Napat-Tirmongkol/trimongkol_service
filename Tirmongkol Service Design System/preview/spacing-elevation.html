<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0f172a;padding:30px 24px;display:flex;gap:22px;align-items:center;justify-content:center}
  .item{text-align:center}
  .box{width:104px;height:70px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#94a3b8}
  .lbl{font-size:11px;font-weight:600;margin-top:11px;color:#475569}
  .ring{border:1px solid #e2e8f0}
  .s-sm{box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .s-md{box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)}
  .s-lg{box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)}
  .s-2xl{box-shadow:0 25px 50px -12px rgba(15,23,42,.18)}
  .s-brand{background:#1f47e6;color:#cfe0ff;box-shadow:0 10px 15px -3px rgba(51,102,255,.4)}
</style></head><body>
  <div class="item"><div class="box ring s-sm">ring + sm</div><div class="lbl">resting card</div></div>
  <div class="item"><div class="box s-md">md</div><div class="lbl">raised</div></div>
  <div class="item"><div class="box s-lg">lg</div><div class="lbl">hover</div></div>
  <div class="item"><div class="box s-2xl">2xl</div><div class="lbl">floating</div></div>
  <div class="item"><div class="box s-brand">brand glow</div><div class="lbl">primary button</div></div>
</body></html>
