<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:30px;display:flex;align-items:center;gap:40px}
  .lockup{display:flex;align-items:center;gap:12px}
  .badge{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#3366ff,#1936b8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:28px;box-shadow:0 8px 16px -4px rgba(51,102,255,.4)}
  .word{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .divider{width:1px;height:70px;background:#e2e8f0}
  .ondark{background:#0f172a;padding:16px 22px;border-radius:14px;display:flex;align-items:center;gap:12px}
  .ondark .word{color:#fff}
  .note{font-size:12px;color:#94a3b8;max-width:150px;line-height:1.5}
</style></head><body>
  <div class="lockup"><div class="badge">T</div><span class="word">Tirmongkol Service</span></div>
  <div class="divider"></div>
  <div class="ondark"><div class="badge" style="width:44px;height:44px;font-size:23px">T</div><span class="word">Tirmongkol Service</span></div>
  <div class="divider"></div>
  <p class="note">Typographic mark — gradient "T" badge + wordmark. No separate logo file.</p>
</body></html>
