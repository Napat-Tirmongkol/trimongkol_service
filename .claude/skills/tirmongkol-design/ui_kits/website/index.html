<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tirmongkol Service — Website UI Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: 'Inter','Noto Sans Thai',system-ui,sans-serif; background: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased; }
  #site-scroll { height: 100vh; overflow-y: auto; scroll-behavior: smooth; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="site-chrome.jsx"></script>
<script type="text/babel" src="site-pages.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  const Navbar = window.Navbar, Footer = window.Footer;
  function App() {
    const [page, setPage] = useState('home');
    const onNav = (p) => {
      if (p === 'app') { window.location.href = '../app/index.html'; return; }
      setPage(p);
      const el = document.getElementById('site-scroll');
      if (el) el.scrollTo({ top: 0, behavior: 'auto' });
    };
    const Pages = { home: window.HomePage, services: window.ServicesPage, about: window.AboutPage, contact: window.ContactPage };
    const Page = Pages[page];
    return (
      <div id="site-scroll">
        <Navbar page={page} onNav={onNav} />
        <Page onNav={onNav} />
        <Footer onNav={onNav} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
