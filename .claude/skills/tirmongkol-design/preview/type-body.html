<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:26px}
  .item{display:flex;align-items:baseline;gap:16px;padding:9px 0;border-bottom:1px solid #f1f5f9}
  .item:last-child{border:0}
  .lbl{flex:0 0 100px;font-size:11px;color:#94a3b8;font-weight:500}
  .eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.18em;color:#1936b8}
  .lead{font-size:18px;line-height:1.5;color:#475569}
  .body{font-size:14px;line-height:1.6;color:#475569}
  .meta{font-size:12px;color:#64748b}
  .caps{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.14em;color:#94a3b8}
</style></head><body>
  <div class="item"><span class="lbl">Eyebrow</span><span class="eyebrow">Our Services</span></div>
  <div class="item"><span class="lbl">Lead · 400</span><span class="lead">We don't just write code — we understand business.</span></div>
  <div class="item"><span class="lbl">Body · 400</span><span class="body">Every system can be tailored to match your business workflow.</span></div>
  <div class="item"><span class="lbl">Meta</span><span class="meta">Due 12 Mar 2025 · Homework</span></div>
  <div class="item"><span class="lbl">Label caps</span><span class="caps">Submitted</span></div>
</body></html>
