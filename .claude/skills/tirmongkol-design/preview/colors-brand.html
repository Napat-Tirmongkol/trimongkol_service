<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:22px}
  .row{display:grid;grid-template-columns:repeat(11,1fr);gap:0;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid #e2e8f0}
  .sw{height:76px;display:flex;align-items:flex-end;padding:7px 8px;font-size:10px;font-weight:600}
  .meta{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:#64748b}
  .tag{font-weight:600;color:#1936b8}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:#eef4ff;color:#1f47e6">50</div>
    <div class="sw" style="background:#d9e6ff;color:#1f47e6">100</div>
    <div class="sw" style="background:#bcd3ff;color:#1f47e6">200</div>
    <div class="sw" style="background:#8eb6ff;color:#14306b">300</div>
    <div class="sw" style="background:#598dff;color:#fff">400</div>
    <div class="sw" style="background:#3366ff;color:#fff">500</div>
    <div class="sw" style="background:#1f47e6;color:#fff">600</div>
    <div class="sw" style="background:#1936b8;color:#fff">700</div>
    <div class="sw" style="background:#1a3093;color:#fff">800</div>
    <div class="sw" style="background:#1c2e74;color:#fff">900</div>
    <div class="sw" style="background:#141d47;color:#fff">950</div>
  </div>
  <div class="meta"><span><span class="tag">brand-500</span> #3366ff · primary</span><span><span class="tag">brand-600</span> #1f47e6 · action</span><span><span class="tag">brand-700</span> #1936b8 · links</span></div>
</body></html>
