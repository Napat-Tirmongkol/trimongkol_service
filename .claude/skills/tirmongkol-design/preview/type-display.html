<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:26px}
  .item{display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px solid #f1f5f9}
  .item:last-child{border:0}
  .lbl{flex:0 0 92px;font-size:11px;color:#94a3b8;font-weight:500}
  .display{font-size:52px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .h1{font-size:34px;font-weight:700;letter-spacing:-.02em}
  .h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
  .grad{background:linear-gradient(135deg,#3366ff,#1936b8);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
  <div class="item"><span class="lbl">Display · 800</span><span class="display">Build Software <span class="grad">That Powers</span></span></div>
  <div class="item"><span class="lbl">H1 · 700</span><span class="h1">Why Choose Us</span></div>
  <div class="item"><span class="lbl">H2 · 700</span><span class="h2">Software designed for your business</span></div>
</body></html>
