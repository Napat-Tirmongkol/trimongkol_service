<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:26px;display:flex;gap:18px;align-items:flex-end}
  .item{text-align:center}
  .box{width:96px;height:70px;background:#eef4ff;border:1.5px solid #8eb6ff}
  .lbl{font-size:12px;font-weight:600;margin-top:9px}
  .px{font-size:11px;color:#94a3b8}
  .pill{width:96px;height:40px;background:#3366ff;border-radius:9999px}
</style></head><body>
  <div class="item"><div class="box" style="border-radius:6px"></div><div class="lbl">md</div><div class="px">6px · inputs</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="lbl">xl</div><div class="px">12px · tiles</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="lbl">2xl</div><div class="px">16px · cards</div></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><div class="lbl">3xl</div><div class="px">24px · feature</div></div>
  <div class="item"><div class="pill"></div><div class="lbl">full</div><div class="px">pills / CTA</div></div>
</body></html>
