<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#0f172a;padding:24px;display:flex;gap:16px}
  .card{flex:1;background:#fff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:22px}
  .tile{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#3366ff,#1936b8);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 12px -3px rgba(51,102,255,.3)}
  .tile svg{width:22px;height:22px}
  h3{font-size:17px;font-weight:600;margin:16px 0 6px}
  p{font-size:13px;line-height:1.55;color:#475569}
  .dark{background:#0f172a;border:none}
  .dark h3{color:#fff}.dark p{color:#cbd5e1}
  .dark .tile{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
  .hint{font-size:11px;color:#94a3b8;margin-top:14px}
</style></head><body>
  <div class="card">
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
    <h3>Fully Customizable</h3>
    <p>Every system can be tailored to match your business workflow.</p>
    <div class="hint">white · ring-slate-200 · rounded-2xl · shadow-sm</div>
  </div>
  <div class="card dark">
    <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
    <h3>Our Vision</h3>
    <p>The trusted technology partner for Thai SMEs in the digital age.</p>
    <div class="hint" style="color:#64748b">slate-900 · white text · inset glass tile</div>
  </div>
</body></html>
