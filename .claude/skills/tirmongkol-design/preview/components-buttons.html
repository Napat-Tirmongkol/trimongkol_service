<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:#0f172a;padding:26px;display:flex;flex-direction:column;gap:16px}
  .grp{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .cap{flex:0 0 88px;font-size:11px;color:#94a3b8;font-weight:500}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:9999px;font-weight:600;font-size:14px;cursor:pointer;border:none}
  .lg{padding:13px 26px}
  .sm{padding:7px 16px;font-size:13px}
  .brand{background:#1f47e6;color:#fff;box-shadow:0 8px 15px -4px rgba(31,71,230,.4)}
  .dark{background:#0f172a;color:#fff}
  .white{background:#fff;color:#0f172a;box-shadow:0 6px 14px -4px rgba(0,0,0,.2);border:1px solid #e2e8f0}
  .ghost{background:#fff;color:#334155;border:1px solid #cbd5e1}
  .disabled{background:#1f47e6;color:#fff;opacity:.6}
  svg{width:16px;height:16px}
</style></head><body>
  <div class="grp"><span class="cap">Primary</span>
    <button class="btn lg brand">Try Free <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    <button class="btn lg dark">Send Message</button>
  </div>
  <div class="grp"><span class="cap">On photo</span>
    <button class="btn lg white">Explore Services <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>
  <div class="grp"><span class="cap">Ghost / sm</span>
    <button class="btn sm ghost">Edit</button>
    <button class="btn sm brand" style="box-shadow:none">+ Add Student</button>
    <button class="btn lg disabled">Disabled</button>
  </div>
</body></html>
